<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>قراءة الكتاب | GO INTO DEEP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #1b302d;
      color: white;
      font-family: Arial, sans-serif;
    }

    .top {
      height: 70px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f6f1e8;
      color: #1b302d;
    }

    .top h1 {
      font-size: 16px;
      margin: 0;
    }

    .back {
      text-decoration: none;
      color: #1b302d;
      font-size: 13px;
      font-weight: bold;
    }

    .reader {
      width: 100%;
      height: calc(100vh - 70px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .fallback {
      text-align: center;
      padding: 30px;
      display: none;
    }

    .fallback a {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #cf765e;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="top">
    <h1>📖 دعوة إلى حياة المسيح</h1>

    <a class="back" href="index.html#books">
      ← الرجوع للكتب
    </a>
  </div>

  <div class="reader">
    <iframe
      src="assets/books/daawa-ila-hayat-al-masih.pdf"
      title="دعوة إلى حياة المسيح">
    </iframe>
  </div>

</body>
</html>
